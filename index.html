<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz Lead</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center relative">

  <!-- Loader overlay -->
  <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white p-4 rounded-xl flex flex-col items-center shadow-lg">
      <svg class="animate-spin h-8 w-8 text-indigo-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <p class="text-gray-700 font-medium">Submitting your lead...</p>
    </div>
  </div>

  <!-- Success popup -->
  <div id="successPopup" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50">
    <div class="bg-white rounded-2xl p-6 text-center shadow-lg w-80">
      <div class="mx-auto mb-4 text-green-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2 class="text-xl font-semibold mb-2" id="popupTitle">Lead Sent Successfully!</h2>
      <p class="text-gray-600 mb-4" id="popupMessage">Your information has been submitted.</p>
      <button id="closePopup" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded w-full">
        Close
      </button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-4 text-center text-gray-700">Register now</h1>

    <form id="leadForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <input name="first_name" value="John" placeholder="First Name" required class="border p-2 rounded w-full" />
        <input name="last_name" value="Doe" placeholder="Last Name" required class="border p-2 rounded w-full" />
      </div>

      <input name="email" type="email" value="your.real.email@gmail.com" placeholder="Email" required class="border p-2 rounded w-full" />
      <input name="password" type="password" value="Aa123456" placeholder="Password" required class="border p-2 rounded w-full" />

      <div class="flex gap-2">
        <select id="countrySelect" class="border p-2 rounded w-32">
          <option value="+91">IN</option>
          <option value="+971">GCC</option>
          <option value="+52">MX</option>
          <option value="+56">CL</option>
          <option value="+84">VN</option>
        </select>
        <input id="areaCode" name="area_code" value="+91" class="border p-2 rounded w-24" />
        <input name="phone" value="9876543210" placeholder="Phone Number" required class="border p-2 rounded flex-1" />
      </div>

      <input name="funnel" value="testfunnel" class="border p-2 rounded w-full" />
      <input name="source" value="https://testfunnel.com" class="border p-2 rounded w-full" />
      <input name="aff_sub" value="1234" class="border p-2 rounded w-full" />
      <input name="aff_sub2" value="Test Funnel Description" class="border p-2 rounded w-full" />

      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded w-full">
        Start Now
      </button>

      <p id="status" class="text-center text-sm mt-2 text-gray-600"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("leadForm");
    const status = document.getElementById("status");
    const countrySelect = document.getElementById("countrySelect");
    const areaCode = document.getElementById("areaCode");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const successPopup = document.getElementById("successPopup");
    const closePopup = document.getElementById("closePopup");
    const popupTitle = document.getElementById("popupTitle");
    const popupMessage = document.getElementById("popupMessage");

    // set area code according to country
    areaCode.value = countrySelect.value;
    countrySelect.addEventListener("change", () => (areaCode.value = countrySelect.value));

    // close popup
    closePopup.addEventListener("click", () => {
      successPopup.classList.add("hidden");
    });

    // get user IP
    let userIP = "";
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => userIP = data.ip)
      .catch(() => userIP = "0.0.0.0");

    // function to check affiliate FTDs
    async function checkAffiliateFTD(token, from, to) {
      const url = new URL("https://blsmapi.net/affiliate_deposits/");
      url.searchParams.append("token", token);
      url.searchParams.append("from", from);
      url.searchParams.append("to", to);
      url.searchParams.append("filter", "ftd");
      url.searchParams.append("limit", "200");

      try {
        const res = await fetch(url.toString());
        if (!res.ok) throw new Error("Failed to fetch FTD data");
        const data = await res.json();
        return data; // Array of FTD leads
      } catch (err) {
        console.error("FTD check error:", err);
        return [];
      }
    }

    // form submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      loadingOverlay.classList.remove("hidden");
      status.textContent = "";

      const formData = new FormData(form);
      const email = formData.get("email");
      const first_name = formData.get("first_name");
      const last_name = formData.get("last_name");
      const funnel = formData.get("funnel") || "testfunnel";

      const emailData = new URLSearchParams({ email, first_name, last_name, funnel, hitid: "" });

      try {
        // Step 1: verify email
        const verifyRes = await fetch("https://blsmapi.net/emails", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: emailData,
        });

        if (!verifyRes.ok) throw new Error("Email verification failed");

        // Step 2: submit lead
        const leadData = new URLSearchParams();
        formData.forEach((v, k) => leadData.append(k, v));
        leadData.append("affid", "148");
        leadData.append("token", "wuX4oS1IU7m2J48qGuFl");
        leadData.append("_ip", userIP);
        leadData.append("hitid", "");

        const leadRes = await fetch("https://blsmapi.net/leads", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: leadData,
        });

        const leadText = await leadRes.text();
        console.log("Blitz lead response:", leadText);

        // Step 3: check FTDs via GET API
        const today = new Date().toISOString().split("T")[0]; // YYYY-MM-DD
        const ftds = await checkAffiliateFTD("12345", today, today);

        loadingOverlay.classList.add("hidden");

        if (ftds.length > 0 || leadText.includes("FTD fired")) {
          popupTitle.textContent = "🎉 FTD Fired!";
          popupMessage.textContent = `Conversion confirmed — ${ftds.length || 1} FTD(s) detected.`;
          successPopup.classList.remove("hidden");
          status.textContent = "✅ FTD fired successfully!";
          alert("✅ FTD Fired — Conversion Confirmed!");
          form.reset();
        } else if (leadRes.ok) {
          popupTitle.textContent = "Lead Sent Successfully!";
          popupMessage.textContent = "Your information has been submitted.";
          successPopup.classList.remove("hidden");
          status.textContent = "✅ Lead submitted successfully.";
          form.reset();
        } else {
          status.textContent = "❌ Lead submission failed.";
          console.error("Blitz error:", leadText);
        }

      } catch (err) {
        loadingOverlay.classList.add("hidden");
        status.textContent = "⚠️ Network or verification error.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
